<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bimacGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E31C1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stylized Bird - BIMAC Logo -->
  <g fill="none" stroke="url(#bimacGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head curve -->
    <path d="M 35 25 Q 25 25 25 35 Q 25 45 35 50"/>
    <!-- Eye -->
    <circle cx="32" cy="35" r="3" fill="url(#bimacGradient)" stroke="none"/>
    <!-- Body top line -->
    <path d="M 35 25 Q 55 15 75 30 Q 85 40 80 55"/>
    <!-- Body bottom curve -->
    <path d="M 35 50 Q 45 55 55 55 Q 70 55 80 55"/>
    <!-- Wing/tail detail -->
    <path d="M 55 55 Q 65 65 75 75"/>
    <!-- Legs -->
    <path d="M 50 55 L 50 75 L 45 80"/>
    <path d="M 50 75 L 55 80"/>
  </g>
</svg>
