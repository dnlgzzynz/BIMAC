    ry: 3.77

# Materiales
materials:
  A36:
    name: "ASTM A36"
    Fy: 250                   # MPa
    Fu: 400                   # MPa
    E: 200000                 # MPa
    density: 7850             # kg/m3
    weldability: "excellent"
    cost_factor: 1.0

  A572_Gr50:
    name: "ASTM A572 Gr. 50"
    Fy: 345                   # MPa
    Fu: 450                   # MPa
    E: 200000
    density: 7850
    weldability: "good"
    cost_factor: 1.15

  A500_Gr_B:
    name: "ASTM A500 Gr. B"
    Fy: 290                   # MPa
    Fu: 400                   # MPa
    E: 200000
    density: 7850
    weldability: "excellent"
    cost_factor: 1.0

  A500_Gr_C:
    name: "ASTM A500 Gr. C"
    Fy: 317                   # MPa
    Fu: 427                   # MPa
    E: 200000
    density: 7850
    weldability: "excellent"
    cost_factor: 1.05

# Restricciones
constraints:
  geometry:
    min_span: 3000
    max_span: 100000
    min_height_ratio: 0.05    # altura/luz minima
    max_height_ratio: 0.30    # altura/luz maxima
    min_bay_count: 4
    max_bay_count: 30

  structural:
    max_slenderness_chord: 200    # L/r maximo cuerdas
    max_slenderness_web: 300      # L/r maximo alma
    min_angle_diagonal: 30        # grados
    max_angle_diagonal: 60        # grados
    deflection_limit: 240         # L/240

  connections:
    min_weld_size: 3              # mm
    max_weld_size: 16             # mm
    min_gusset_thickness: 6       # mm
    max_gusset_thickness: 25      # mm
    min_bolt_edge_distance: 1.5   # x diametro

# Costos (MXN)
costs:
  material:
    steel_per_kg: 28              # MXN/kg base
    A36_factor: 1.0
    A572_factor: 1.15
    A500_B_factor: 1.0
    A500_C_factor: 1.05

  fabrication:
    cutting_per_cut: 45           # MXN/corte
    welding_per_kg: 18            # MXN/kg
    drilling_per_hole: 25         # MXN/agujero
    gusset_plate_per_kg: 35       # MXN/kg

  finishing:
    sandblast_per_m2: 85          # MXN/m2
    primer_per_m2: 65             # MXN/m2
    paint_per_m2: 120             # MXN/m2
    galvanize_per_kg: 10          # MXN/kg

  installation:
    assembly_per_kg: 8            # MXN/kg
    crane_per_day: 15000          # MXN/dia
    crew_per_day: 8500            # MXN/dia

# Parametros BIM
bim:
  shared_parameters:
    - name: "BIMAC_Truss_Type"
      type: "Text"
      group: "Identity Data"
    - name: "BIMAC_Truss_Span"
      type: "Length"
      group: "Dimensions"
    - name: "BIMAC_Truss_Height"
      type: "Length"
      group: "Dimensions"
    - name: "BIMAC_Truss_Weight"
      type: "Number"
      group: "Structural"
    - name: "BIMAC_Member_Force"
      type: "Number"
      group: "Structural"
    - name: "BIMAC_Member_Utilization"
      type: "Number"
      group: "Structural"

  classification:
    uniclass: "Ss_20_50_80"       # Truss structures
    omniclass: "23-13 15 11"      # Steel Trusses
    ifc_class: "IfcElementAssembly"
    ifc_type: "TRUSS"

# Exportacion
export:
  revit:
    family_category: "Structural Framing"
    use_adaptive: true
    schedule_name: "BIMAC_Truss_Schedule"

  ifc:
    version: "IFC4"
    property_sets:
      - "Pset_BeamCommon"
      - "BIMAC_TrussProperties"

  tekla:
    export_format: "IFC"
    include_connections: true
