# E02 - Cercha Parametrica
# Configuracion del componente

component:
  id: "E02"
  name: "Cercha Parametrica"
  category: "estructuras"
  version: "1.0.0"
  author: "BIMAC"
  created: "2025-12-27"
  status: "development"

# Parametros por defecto
defaults:
  geometry:
    span: 12000              # mm
    height: 2000             # mm (auto = span/6)
    slope: 15                # grados
    bay_count: 8             # numero de modulos
    overhang: 0              # mm - volado en extremos

  truss_type: "pratt"        # Tipologia por defecto

  profiles:
    top_chord: "HSS_150x150x6"
    bottom_chord: "HSS_150x150x6"
    web_diagonal: "HSS_100x100x4"
    web_vertical: "HSS_75x75x3"
    material: "A500_Gr_B"

  connections:
    type: "welded"           # welded | bolted | pinned
    gusset_plate: true
    gusset_thickness: 12     # mm
    gusset_material: "A36"
    weld_size: 6             # mm (filete)
    bolt_diameter: 20        # mm (si es atornillada)
    bolt_grade: "A325"

  supports:
    left: "pinned"           # pinned | fixed | roller
    right: "roller"          # pinned | fixed | roller

# Tipologias disponibles
truss_types:
  # Cerchas triangulares
  fink:
    name: "Fink"
    description: "Diagonales en patron W"
    category: "triangular"
    min_span: 6000
    max_span: 15000
    optimal_ratio: 0.20      # altura/luz
    diagonal_pattern: "W"

  howe:
    name: "Howe"
    description: "Verticales en compresion, diagonales en tension"
    category: "triangular"
    min_span: 8000
    max_span: 25000
    optimal_ratio: 0.15
    diagonal_direction: "outward"

  pratt:
    name: "Pratt"
    description: "Verticales en tension, diagonales en compresion"
    category: "triangular"
    min_span: 8000
    max_span: 30000
    optimal_ratio: 0.12
    diagonal_direction: "inward"

  warren:
    name: "Warren"
    description: "Solo diagonales alternadas"
    category: "triangular"
    min_span: 10000
    max_span: 50000
    optimal_ratio: 0.10
    has_verticals: false

  warren_vertical:
    name: "Warren con Verticales"
    description: "Warren con montantes verticales"
    category: "triangular"
    min_span: 10000
    max_span: 50000
    optimal_ratio: 0.10
    has_verticals: true

  scissors:
    name: "Scissors"
    description: "Cuerdas cruzadas para altura interior"
    category: "triangular"
    min_span: 8000
    max_span: 18000
    optimal_ratio: 0.25
    interior_height_gain: 0.6

  fan:
    name: "Fan"
    description: "Diagonales radiales desde apoyos"
    category: "triangular"
    min_span: 6000
    max_span: 15000
    optimal_ratio: 0.18

  # Cerchas paralelas
  parallel_pratt:
    name: "Pratt Paralela"
    description: "Cuerdas paralelas, diagonales al centro"
    category: "parallel"
    min_span: 15000
    max_span: 60000
    optimal_ratio: 0.08
    depth_ratio: 0.06        # peralte/luz

  parallel_warren:
    name: "Warren Paralela"
    description: "Cuerdas paralelas, diagonales alternas"
    category: "parallel"
    min_span: 20000
    max_span: 80000
    optimal_ratio: 0.07
    depth_ratio: 0.05

  vierendeel:
    name: "Vierendeel"
    description: "Marco rigido sin diagonales"
    category: "parallel"
    min_span: 8000
    max_span: 25000
    optimal_ratio: 0.10
    moment_frame: true

  # Cerchas curvas
  bowstring:
    name: "Bowstring"
    description: "Cuerda superior arqueada"
    category: "curved"
    min_span: 20000
    max_span: 80000
    optimal_ratio: 0.12
    curve_type: "parabolic"

  crescent:
    name: "Crescent"
    description: "Ambas cuerdas curvas"
    category: "curved"
    min_span: 15000
    max_span: 50000
    optimal_ratio: 0.15
    curve_type: "arc"

  lenticular:
    name: "Lenticular"
    description: "Forma de lente simetrica"
    category: "curved"
    min_span: 30000
    max_span: 100000
    optimal_ratio: 0.08
    symmetric: true

# Perfiles disponibles (seccion, area, inercia, peso)
profiles:
  # HSS - Hollow Structural Sections (Rectangulares)
  HSS_50x50x3:
    type: "HSS"
    dimensions: [50, 50, 3]
    area: 5.41                # cm2
    Ix: 14.8                  # cm4
    Iy: 14.8                  # cm4
    weight: 4.25              # kg/m
    rx: 1.65                  # cm
    ry: 1.65                  # cm

  HSS_75x75x3:
    type: "HSS"
    dimensions: [75, 75, 3]
    area: 8.41
    Ix: 53.2
    Iy: 53.2
    weight: 6.60
