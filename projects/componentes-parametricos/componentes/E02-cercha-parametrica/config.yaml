    ry: 8.25

  # Angulos
  L_50x50x5:
    type: "L"
    dimensions: [50, 50, 5]
    area: 4.80
    Ix: 11.0
    Iy: 11.0
    weight: 3.77
    rx: 1.51
    ry: 1.51

  L_75x75x6:
    type: "L"
    dimensions: [75, 75, 6]
    area: 8.73
    Ix: 51.7
    Iy: 51.7
    weight: 6.85
    rx: 2.43
    ry: 2.43

  L_100x100x8:
    type: "L"
    dimensions: [100, 100, 8]
    area: 15.5
    Ix: 166
    Iy: 166
    weight: 12.2
