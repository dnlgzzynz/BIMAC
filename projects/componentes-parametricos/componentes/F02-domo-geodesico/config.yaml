# F02 - Domo Geodesico Parametrico
# Configuracion de parametros y materiales

metadata:
  id: F02
  name: Domo Geodesico Parametrico
  version: 1.0.0
  category: Fachadas
  author: BIMAC

# Geometria base
geometry:
  base_polyhedra:
    icosahedron:
      vertices: 12
      edges: 30
      faces: 20
      dihedral_angle: 138.19
      description: "Poliedro regular de 20 caras triangulares"

    octahedron:
      vertices: 6
      edges: 12
      faces: 8
      dihedral_angle: 109.47
      description: "Poliedro regular de 8 caras triangulares"

    tetrahedron:
      vertices: 4
      edges: 6
      faces: 4
      dihedral_angle: 70.53
      description: "Poliedro regular de 4 caras triangulares"

  frequencies:
    1:
      name: "1V"
      chord_factors: [1.0]
      unique_struts: 1
      description: "Sin subdivision"
    2:
      name: "2V"
      chord_factors: [0.5465, 0.6180]
      unique_struts: 2
      description: "Subdivision simple"
    3:
      name: "3V"
      chord_factors: [0.3486, 0.4035, 0.4124]
      unique_struts: 3
      description: "Subdivision media"
    4:
      name: "4V"
      chord_factors: [0.2533, 0.2946, 0.2985, 0.3128]
      unique_struts: 6
      description: "Subdivision fina"
    5:
      name: "5V"
      chord_factors: [0.1981, 0.2311, 0.2326, 0.2449, 0.2454]
      unique_struts: 9
      description: "Subdivision muy fina"
    6:
      name: "6V"
      chord_factors: [0.1625, 0.1899, 0.1907, 0.2013, 0.2016, 0.2035]
      unique_struts: 9
      description: "Subdivision ultra fina"

  truncations:
    full:
      ratio: 1.0
      angle: 180
      description: "Esfera completa"
    five_eighths:
      ratio: 0.625
      angle: 112.5
      description: "5/8 de esfera"
    half:
      ratio: 0.5
      angle: 90
      description: "Hemisferio"
    three_eighths:
      ratio: 0.375
      angle: 67.5
      description: "3/8 de esfera"
    quarter:
      ratio: 0.25
      angle: 45
      description: "1/4 de esfera"

